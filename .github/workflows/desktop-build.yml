name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build desktop bundle
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.GALDUS_API_BASE_URL }}
        run: npm run tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: galdus-desktop-${{ matrix.platform }}
          path: apps/web/src-tauri/target/release/bundle/**
