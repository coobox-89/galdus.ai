name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build for the repository sub-path
        run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          # Override with a repository variable if the API hostname differs.
          VITE_API_BASE_URL: ${{ vars.GALDUS_API_BASE_URL || 'https://galdus-api.onrender.com/api' }}
          VITE_LEGAL_OPERATOR: ${{ vars.LEGAL_OPERATOR }}
          VITE_LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}
          VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          VITE_LEGAL_COUNTRY: ${{ vars.LEGAL_COUNTRY }}
      - name: SPA fallback for deep links (/privacy, /terms, ...)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
