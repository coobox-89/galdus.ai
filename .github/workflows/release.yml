name: Release

# Push a tag like v1.0.0 (or v1.0.0-rc.1) to publish a GitHub release whose notes are that
# version's section of CHANGELOG.md. Tags containing "-" are marked as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python3 -c "import re;print(re.search(r'VERSION = \"(.+)\"', open('apps/api/app/version.py').read()).group(1))")
          test "$TAG" = "$APP" || { echo "Tag $TAG does not match apps/api/app/version.py ($APP)"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## / {if (on) exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "Galdus.ai $GITHUB_REF_NAME" --notes-file notes.md $PRE
