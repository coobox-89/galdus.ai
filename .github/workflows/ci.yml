name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: galdus_test
          POSTGRES_USER: galdus
          POSTGRES_PASSWORD: galdus_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galdus -d galdus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://galdus:galdus_ci_only@localhost:5432/galdus_test
      TEST_DATABASE_URL: postgresql+asyncpg://galdus:galdus_ci_only@localhost:5432/galdus_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies (exact versions from requirements.lock)
        run: pip install -c requirements.lock -e ".[test]"
      - name: Check Python syntax
        run: python -m compileall -q app migrations tests
      - name: Migrate empty database, round-trip and check for drift
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run unit and integration tests
        run: pytest -q
      - name: OpenAPI document is current (docs/api/openapi.json)
        run: |
          python -m app.openapi_export ../../docs/api/openapi.json
          git diff --exit-code ../../docs/api/openapi.json
      - name: Audit Python dependencies (blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit dependencies (high and critical block the build)
        run: npm audit --audit-level=high
      - name: Build web application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
      - name: Ensure no server secrets leak into the bundle
        run: |
          ! grep -rEq "sk-[A-Za-z0-9]{20,}|JWT_SECRET|DATABASE_URL|postgres(ql)?://" dist

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --redact --config .gitleaks.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t galdus-api:ci apps/api
      - name: Build web image
        run: docker build -t galdus-web:ci apps/web

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: galdus_e2e
          POSTGRES_USER: galdus
          POSTGRES_PASSWORD: galdus_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galdus -d galdus_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://galdus:galdus_ci_only@localhost:5432/galdus_e2e
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ENCRYPTION_KEY: ci-only-encryption-key-with-32-characters
      CORS_ORIGINS: http://127.0.0.1:4173
      ALLOW_PRIVATE_MODEL_ENDPOINTS: "true"
      VITE_API_BASE_URL: http://127.0.0.1:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install and migrate the API
        working-directory: apps/api
        run: |
          pip install -c requirements.lock -e .
          alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the console
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: apps/web
        run: npx playwright test --trace retain-on-failure
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
