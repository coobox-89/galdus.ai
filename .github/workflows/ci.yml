name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: galdus_test
          POSTGRES_USER: galdus
          POSTGRES_PASSWORD: galdus_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galdus -d galdus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://galdus:galdus_ci_only@localhost:5432/galdus_test
      TEST_DATABASE_URL: postgresql+asyncpg://galdus:galdus_ci_only@localhost:5432/galdus_test
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and test dependencies
        run: pip install -e ".[test]"
      - name: Check Python syntax
        run: python -m compileall -q app migrations tests
      - name: Migrate empty database, round-trip and check for drift
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run unit and integration tests
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
      - name: Ensure no server secrets leak into the bundle
        run: |
          ! grep -rEq "sk-[A-Za-z0-9]{20,}|JWT_SECRET|DATABASE_URL|postgres(ql)?://" dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t galdus-api:ci apps/api
