services:
  api:
    build: ./apps/api
    env_file: .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    build: ./apps/web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    depends_on: [api]
