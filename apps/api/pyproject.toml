[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "galdus-ai-api"
version = "0.3.0"
description = "Galdus.ai API scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "litellm>=1.50,<2", "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "email-validator>=2.2,<3", "cryptography>=42"]
[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["."]
