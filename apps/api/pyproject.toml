[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "galdus-ai-api"
version = "1.0.0rc1"
description = "Galdus.ai API: identity, models, chat, knowledge, agents and automations"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.118,<1", "uvicorn[standard]>=0.30,<1", "litellm>=1.50,<2", "pydantic-settings>=2.6,<3", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "email-validator>=2.2,<3", "cryptography>=42,<51", "pgvector>=0.3,<1", "pypdf>=5,<8", "python-multipart>=0.0.18,<1", "croniter>=2,<8", "mcp>=2.3,<3", "httpx>=0.27,<1", "segno>=1.6,<2"]
[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["."]
