[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "galdus-ai-api"
version = "0.1.0"
description = "Galdus.ai API scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "litellm>=1.50,<2", "pydantic-settings>=2.6,<3"]
[tool.setuptools.packages.find]
where = ["."]
