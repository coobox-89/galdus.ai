server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The console also ships a <meta> CSP; headers add what a meta tag cannot (frame-ancestors).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://api:8000/health; }
  location = /readyz { proxy_pass http://api:8000/readyz; }
  # `expires` (not add_header) so the security headers above are inherited by these locations.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
