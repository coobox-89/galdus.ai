[package]
name = "galdus-ai-desktop"
version = "0.9.0"
description = "Galdus.ai desktop application"
authors = ["Mario Cubello"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "galdus_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
