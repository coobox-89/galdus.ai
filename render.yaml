# Render Blueprint for the Galdus.ai API.
# Preview launch runs on the free plan: the service sleeps after ~15 minutes idle
# and the first request then takes 30-60 s. For real traffic change `plan` to
# `starter` (always on), set RUN_MIGRATIONS_ON_START to "false" and uncomment
# preDeployCommand.
services:
  - type: web
    name: galdus-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /readyz
    # preDeployCommand: alembic upgrade head   # paid plans only
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true   # encrypts workspace provider keys (BYOK); back it up, never rotate casually
      - key: DATABASE_URL
        sync: false   # Supabase session-pooler URL, entered in the Render dashboard
      - key: CORS_ORIGINS
        value: https://coobox-89.github.io,https://galdus-ai.netlify.app
      - key: LITELLM_MODEL
        value: openai/gpt-4o-mini
      - key: ALLOWED_MODELS
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTOMATION_TOKEN
        sync: false   # same value as the GitHub secret GALDUS_AUTOMATION_TOKEN
      - key: PUBLIC_API_URL
        value: https://galdus-api.onrender.com
      - key: FRONTEND_URL
        value: https://coobox-89.github.io/galdus.ai
      # Sign in with Google/GitHub and Drive/SharePoint connectors: leave empty to hide.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Email for invitations and password reset (any SMTP provider).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false   # your email: that account becomes platform admin when it registers
      - key: DAILY_TOKEN_BUDGET_PER_USER
        value: "200000"
